# The daily release: at 04:00 Amsterdam time, when the package changed on dev since the last release, tools/release.sh raises the
# version numbers, commits that to dev and moves main to dev; this workflow then checks, builds and publishes the release v<version>.
# Run it by hand (Actions > Release > Run workflow) for an urgent fix; it releases what is on dev then.
# Skip the scheduled runs for a while: set the repository variable RELEASE_HOLD to 1 (Settings > Secrets and variables > Actions).
name: Release
on:
  schedule:
    - cron: "0 2,3 * * *"   # 02:00 and 03:00 UTC: one of them is 04:00 in Amsterdam, summer or winter
  workflow_dispatch:
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Time and hold
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          HOLD: ${{ vars.RELEASE_HOLD }}
        run: |
          go=1
          if [ "${{ github.event_name }}" = schedule ]; then
            h=$(TZ=Europe/Amsterdam date +%H)
            # GitHub starts scheduled runs late, often by hours (09:00 instead of 04:00): 04:00 until noon counts, once a day
            case "$h" in 04|05|06|07|08|09|10|11) ;; *) echo "not between 04:00 and 12:00 in Amsterdam ($h)"; go=0 ;; esac
            [ "$HOLD" = 1 ] && { echo "RELEASE_HOLD is set"; go=0; }
            today=$(TZ=Europe/Amsterdam date +%F)
            pub=$(gh release view --repo "$GITHUB_REPOSITORY" --json publishedAt -q .publishedAt 2>/dev/null || true)
            [ -n "$pub" ] && [ "$(TZ=Europe/Amsterdam date -d "$pub" +%F)" = "$today" ] && { echo "already released today"; go=0; }
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == '1'
        with:
          ref: refs/heads/dev
          fetch-depth: 0
      - name: Cache Node 8 and the old Chromium builds
        if: steps.gate.outputs.go == '1'
        uses: actions/cache@v4
        with:
          path: ~/.cache/cleanyourtv
          key: cytv-engines-${{ runner.os }}-node8.12.0-chromium555668-706915
      - name: Libraries the old Chromium builds need
        if: steps.gate.outputs.go == '1'
        run: |
          sudo apt-get update -qq
          for p in libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2t64 libpangocairo-1.0-0 libgtk-3-0t64 libxss1 libxtst6 fonts-liberation; do sudo apt-get install -y -qq $p >/dev/null 2>&1 || echo "not installed: $p"; done
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == '1'
        with:
          node-version: 22
      - name: Development tools (type checks, lint, formatting)
        if: steps.gate.outputs.go == '1'
        run: npm ci --no-audit --no-fund
      - name: Checks (before anything is changed)
        if: steps.gate.outputs.go == '1'
        run: sh tools/check.sh --chromium
      - name: Version numbers, commit to dev, move main
        id: rel
        if: steps.gate.outputs.go == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          sh tools/release.sh
      - name: Build and publish the release
        if: steps.rel.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          sh tools/check.sh
          CYTV_REPO="$GITHUB_REPOSITORY" python3 ipk/build.py
          gh release create "$TAG" --target "$(git rev-parse HEAD)" --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" \
            dist/*.ipk dist/*.ipk.sha256 dist/*.tgz dist/*.tgz.sha256 dist/apps.json dist/*.manifest.json
          # pushes made with this workflow's token start no workflows, so the dev build (now with the new version) is started here
          gh workflow run dev-build.yml --ref refs/heads/dev
      - name: Publish the documentation
        if: steps.rel.outputs.docs == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --ref refs/heads/main
